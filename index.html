<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Planner</title>

    <!-- Polyfill for making HTML5 drag and drop possible on mobile -->
    <link href="    @3.0.0-rc.0/default.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- AUTH SCREEN (visible by default until session is checked) -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2 id="auth-title">Log In</h2>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required autocomplete="username">
                <input type="password" id="auth-password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" id="auth-submit-btn">Log In</button>
            </form>
            <p id="auth-error" class="error-text"></p>
            <div class="auth-toggle">
                <span id="toggle-text">Don't have an account?</span>
                <a href="#" id="toggle-auth-btn">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN (hidden until login) -->
    <div id="app-screen" class="hidden">
        <header class="top-bar">
            <h1>Smart Planner</h1>
            <div class="header-controls">
                <button id="theme-toggle">Dark Mode</button>
                <button id="logout-btn" class="btn-logout">Log Out</button>
            </div>
        </header>

        <main>
            <form id="add-form" class="task-form">
                <input type="text" id="title" placeholder="Task Title" required>
                <input type="text" id="desc" placeholder="Description (Optional)">
                <input type="date" id="date">
                <button type="submit">Add Task</button>
            </form>

            <div class="board">
                <div class="column" id="todo"><h2>To Do</h2></div>
                <div class="column" id="progress"><h2>In Progress</h2></div>
                <div class="column" id="done"><h2>Done</h2></div>
            </div>
        </main>
    </div>

    <!--Polyfill JS and import of scroll behaviour-->
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@3.0.0-rc.0/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@3.0.0-rc.0/scroll-behaviour.min.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
